<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif" role="img" aria-label="個資馬賽克的用法：原始資料在自己電腦遮成代號，交給 AI 或廠商處理，拿回來的回覆再用對照表換回真名">
  <title>個資馬賽克怎麼用</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6876"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="330" rx="18" fill="#ffffff" stroke="#d5dbe3"/>

  <!-- 自己的電腦 -->
  <rect x="20" y="20" width="620" height="290" rx="14" fill="#eef5ff" stroke="#1565c0" stroke-dasharray="6 5"/>
  <text x="40" y="50" font-size="17" font-weight="bold" fill="#1565c0">🔒 在自己的電腦裡（不上網）</text>

  <!-- 外面 -->
  <rect x="680" y="20" width="300" height="290" rx="14" fill="#fff8e6" stroke="#e0b400" stroke-dasharray="6 5"/>
  <text x="700" y="50" font-size="17" font-weight="bold" fill="#8a6400">🌐 外面（只看得到代號）</text>

  <g font-size="15" fill="#1d2733">
    <!-- 原始資料 -->
    <rect x="40" y="70" width="170" height="92" rx="12" fill="#fff" stroke="#d5dbe3" stroke-width="2"/>
    <text x="125" y="96" text-anchor="middle" font-weight="bold">📄 原始資料</text>
    <text x="125" y="122" text-anchor="middle">林美華</text>
    <text x="125" y="146" text-anchor="middle">0912-345-678</text>

    <!-- 遮好 -->
    <rect x="290" y="70" width="170" height="92" rx="12" fill="#fff" stroke="#d5dbe3" stroke-width="2"/>
    <text x="375" y="96" text-anchor="middle" font-weight="bold">遮好的資料</text>
    <text x="375" y="122" text-anchor="middle" fill="#1565c0" font-weight="bold">[姓名1]</text>
    <text x="375" y="146" text-anchor="middle" fill="#1565c0" font-weight="bold">[電話1]</text>

    <line x1="214" y1="116" x2="284" y2="116" stroke="#5b6876" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="249" y="104" text-anchor="middle" font-size="14" fill="#5b6876">① 遮蔽</text>

    <!-- 對照表 -->
    <rect x="290" y="196" width="170" height="92" rx="12" fill="#fdecea" stroke="#b3261e" stroke-width="2"/>
    <text x="375" y="222" text-anchor="middle" font-weight="bold" fill="#b3261e">🗝 對照表</text>
    <text x="375" y="248" text-anchor="middle" font-size="14">[姓名1] = 林美華</text>
    <text x="375" y="272" text-anchor="middle" font-size="13" fill="#b3261e">只留在自己電腦</text>
    <line x1="375" y1="166" x2="375" y2="190" stroke="#b3261e" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- 外面處理 -->
    <rect x="720" y="70" width="220" height="92" rx="12" fill="#fff" stroke="#d5dbe3" stroke-width="2"/>
    <text x="830" y="96" text-anchor="middle" font-weight="bold">🤖 AI 或廠商處理</text>
    <text x="830" y="122" text-anchor="middle">寫信、整理、翻譯</text>
    <text x="830" y="146" text-anchor="middle" fill="#5b6876" font-size="14">看不到真名</text>
    <line x1="464" y1="116" x2="714" y2="116" stroke="#5b6876" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="590" y="104" text-anchor="middle" font-size="14" fill="#5b6876">複製貼上，交出去</text>

    <!-- 回覆 -->
    <rect x="720" y="196" width="220" height="92" rx="12" fill="#fff" stroke="#d5dbe3" stroke-width="2"/>
    <text x="830" y="222" text-anchor="middle" font-weight="bold">📨 傳回來的文字</text>
    <text x="830" y="250" text-anchor="middle"><tspan fill="#1565c0" font-weight="bold">[姓名1]</tspan> 您好，請回診</text>
    <line x1="830" y1="166" x2="830" y2="190" stroke="#5b6876" stroke-width="2.5" marker-end="url(#a)"/>

    <!-- 換回 -->
    <rect x="40" y="196" width="170" height="92" rx="12" fill="#e7f6ec" stroke="#1b7f3b" stroke-width="3"/>
    <text x="125" y="222" text-anchor="middle" font-weight="bold" fill="#1b7f3b">✅ 換回真名</text>
    <text x="125" y="250" text-anchor="middle"><tspan font-weight="bold">林美華</tspan> 您好</text>
    <text x="125" y="272" text-anchor="middle">請回診</text>
    <line x1="714" y1="242" x2="466" y2="242" stroke="#1565c0" stroke-width="3" marker-end="url(#b)"/>
    <text x="590" y="232" text-anchor="middle" font-size="14" fill="#1565c0" font-weight="bold">② 貼回來</text>
    <line x1="286" y1="242" x2="216" y2="242" stroke="#1b7f3b" stroke-width="3" marker-end="url(#a)"/>
  </g>
</svg>
